<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certificate of Participation — All 25 Participants (A4 Landscape)</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <script src="shared/ornaments.js"></script>
  <style>
    @page {
      size: 297mm 210mm;
      margin: 0;
    }

    .batch-panel {
      background: #141E30;
      border: 1px solid rgba(229, 193, 88, 0.35);
      border-radius: 10px;
      padding: 14px 20px;
      width: 100%;
      max-width: 1120px;
      color: #E2E8F0;
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .batch-panel.open {
      display: flex;
    }

    .batch-panel textarea {
      width: 100%;
      min-height: 180px;
      background: #0B1320;
      color: #FFFFFF;
      border: 1px solid rgba(79, 168, 224, 0.45);
      border-radius: 6px;
      padding: 10px;
      font-family: var(--font-sans);
      font-size: 13px;
    }

    .cert-page {
      width: 297mm;
      height: 210mm;
      position: relative;
      overflow: hidden;
      /* Narrowed outer margin so no space is wasted */
      padding: 3.5mm 4mm;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: stretch;
      justify-content: center;
      background-color: var(--parchment-bg);
    }

    .cert-frame-outer {
      width: 100%;
      height: 100%;
      border: 3.5px solid var(--navy-royal);
      padding: 2mm;
      position: relative;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(255, 253, 248, 0.96) 0%, rgba(244, 235, 220, 0.88) 68%, rgba(226, 208, 174, 0.94) 100%);
      display: flex;
    }

    .side-accent-left,
    .side-accent-right {
      position: absolute;
      top: 16mm;
      bottom: 16mm;
      width: 3mm;
      background: linear-gradient(180deg, var(--navy-royal) 0%, var(--gold-rich) 50%, var(--navy-royal) 100%);
      opacity: 0.9;
    }
    .side-accent-left { left: 0; }
    .side-accent-right { right: 0; }

    .cert-frame-inner {
      width: 100%;
      height: 100%;
      border: 2.2px solid var(--gold-rich);
      outline: 1.2px solid rgba(0, 119, 192, 0.38);
      outline-offset: -3.2mm;
      padding: 5mm 10mm 4.5mm;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      z-index: 2;
    }

    .watermark-seal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 130mm;
      height: 130mm;
      opacity: 0.05;
      pointer-events: none;
      z-index: 0;
      object-fit: contain;
    }

    .corner {
      position: absolute;
      width: 23mm;
      height: 23mm;
      z-index: 3;
      pointer-events: none;
    }
    .corner svg { width: 100%; height: 100%; }
    .corner.tl { top: 1mm; left: 1mm; }
    .corner.tr { top: 1mm; right: 1mm; transform: scaleX(-1); }
    .corner.bl { bottom: 1mm; left: 1mm; transform: scaleY(-1); }
    .corner.br { bottom: 1mm; right: 1mm; transform: scale(-1, -1); }

    /* Header */
    .cert-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      z-index: 2;
    }

    .cert-header .logo-seal {
      width: 21mm;
      height: 21mm;
      object-fit: contain;
    }

    .cert-header .logo-bagong {
      width: 22mm;
      height: 22mm;
      object-fit: contain;
    }

    .header-gov-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.2;
      padding: 0 8px;
    }

    .header-gov-text .rep {
      font-family: var(--font-serif);
      font-size: 11pt;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink-body);
    }

    .header-gov-text .city {
      font-family: var(--font-display);
      font-size: 12.2pt;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--navy-royal);
    }

    .header-gov-text .lib {
      font-family: var(--font-display);
      font-size: 14.8pt;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--blue-cerulean);
    }

    /* Title */
    .cert-title-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .cert-title-main {
      font-family: var(--font-display);
      font-size: 33pt;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--navy-deep);
      line-height: 1.03;
    }

    .cert-subtitle-pill {
      margin-top: 1mm;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 14.2pt;
      font-weight: 600;
      color: var(--gold-dark);
    }

    /* Participant Name */
    .recipient-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%;
      z-index: 2;
    }

    .recipient-name {
      font-family: var(--font-display);
      font-size: 29pt;
      font-weight: 800;
      color: var(--navy-royal);
      letter-spacing: 0.04em;
      padding: 0 22px 2px;
      border-bottom: 2.2px solid var(--gold-rich);
      min-width: 165mm;
      line-height: 1.12;
    }

    /* Citation */
    .citation-body {
      max-width: 248mm;
      font-family: var(--font-serif);
      font-size: 14.5pt;
      line-height: 1.42;
      color: var(--ink-dark);
      z-index: 2;
    }

    .citation-body .workshop-title {
      font-weight: 700;
      font-style: italic;
      color: var(--navy-deep);
      font-size: 15.8pt;
      display: inline-block;
      margin-top: 0.8mm;
    }

    .citation-given {
      margin-top: 1.8mm;
      font-size: 13pt;
      font-style: italic;
      color: var(--ink-body);
    }

    /* 4-Signatory Block (3 Speakers + 1 City Librarian) */
    .signatories-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 3mm;
      z-index: 2;
    }

    .speakers-sig-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10mm;
      width: 100%;
      padding: 0 4mm;
    }

    .sig-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .sig-box .sig-line {
      width: 68mm;
      height: 8mm;
      border-bottom: 1.8px solid var(--navy-deep);
      margin-bottom: 3px;
    }

    .sig-box .sig-name {
      font-family: var(--font-display);
      font-size: 11.8pt;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--navy-deep);
    }

    .sig-box .sig-role {
      font-family: var(--font-sans);
      font-size: 8.8pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--gold-dark);
    }

    .bottom-librarian-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      width: 100%;
      padding: 0 5mm;
    }

    .cert-meta-left {
      text-align: left;
      font-family: var(--font-sans);
      font-size: 8.8pt;
      color: var(--ink-muted);
      line-height: 1.4;
      border-left: 3px solid var(--gold-rich);
      padding-left: 9px;
    }

    .librarian-sig-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .librarian-sig-box .sig-line {
      width: 80mm;
      height: 8.5mm;
      border-bottom: 2px solid var(--navy-deep);
      margin-bottom: 3px;
    }

    .librarian-sig-box .sig-name {
      font-family: var(--font-display);
      font-size: 14pt;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--navy-deep);
    }

    .librarian-sig-box .sig-role {
      font-family: var(--font-sans);
      font-size: 10pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--blue-cerulean);
    }

    .librarian-sig-box .sig-office {
      font-family: var(--font-serif);
      font-size: 9.8pt;
      font-style: italic;
      color: var(--ink-muted);
    }

    .seal-right {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="studio-toolbar">
    <div class="toolbar-left">
      <a href="index.html" class="back-link">← Studio Hub</a>
      <h1>2. Certificate for Participants (All 25 Loaded)</h1>
      <span class="spec-badge">A4 Landscape • Narrow Margins • 25 Pages</span>
    </div>
    <div class="toolbar-actions">
      <button class="btn-outline" onclick="document.getElementById('batchPanel').classList.toggle('open')">
        👥 Edit Participant List (25)
      </button>
      <button class="btn-gold" onclick="window.print()">🖨️ Print / Save All 25 PDFs (A4)</button>
    </div>
  </div>

  <!-- Pre-populated from participants.txt -->
  <div id="batchPanel" class="batch-panel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <strong>Participant List from <code>participants.txt</code> (25 Participants — one per line):</strong>
      <button class="btn-gold" onclick="renderBatchCertificates()">Update Pages</button>
    </div>
    <textarea id="participantListInput">VIVIEN F. BANZUELO, RL
IRENE DIANNE A. ESTRADA-TORRES
DON ANGEL LOU M. SALVATIERRA
JUDITH C. ALARO
IMELDA G. BALDEVIESO
IYNOR D. CUDIO
REVELYN O. ELEVERA
ROSE ANN R. EROJO
JENNIFER P. GONZAGA
AILEEN R. MANANSALA
JOHN CARLO L. NARCISO
PERLA J. NOBLEJAS
JOSEPH P. TAMPIL
SELWYN JACOB D. VALLEJO
CRISTINA S. DUMARAN
KATHRYN MAE C. GAN
ANNALYN C. GUANZON
ROSENDO A. LANDICHO
MARY ROSE T. LUCERO
ELLEN JEAN N. MADRID
JOAN C. MERCED
MYRNA C. PALAO
ANNA ELYZZA JANE T. RAMOS
MARY MAY L. VILLAVICENCIO
JOYMARIE B. OLAPE, RL</textarea>
  </div>

  <div id="participant-certs-container" style="display:flex; flex-direction:column; gap:32px;"></div>

  <script>
    function buildParticipantCertificate(participantName, index) {
      const refNum = String(index + 1).padStart(3, '0');
      return `
        <div class="cert-frame-outer">
          <div class="side-accent-left"></div>
          <div class="side-accent-right"></div>

          <div class="cert-frame-inner">
            <div class="corner tl">${PPCLOrnaments.cornerFiligree(86)}</div>
            <div class="corner tr">${PPCLOrnaments.cornerFiligree(86)}</div>
            <div class="corner bl">${PPCLOrnaments.cornerFiligree(86)}</div>
            <div class="corner br">${PPCLOrnaments.cornerFiligree(86)}</div>

            <img class="watermark-seal" src="logo/ppcitylibrary-logo.png" alt="" />

            <header class="cert-header">
              <img class="logo-seal" src="logo/Puerto_Princesa_city_seal.svg.png" alt="Puerto Princesa City Seal" />
              <img class="logo-seal" src="logo/ppcitylibrary-logo.png" alt="Puerto Princesa City Library Logo" />
              <div class="header-gov-text">
                <span class="rep">Republic of the Philippines</span>
                <span class="city">City Government of Puerto Princesa</span>
                <span class="lib">Puerto Princesa City Library</span>
              </div>
              <img class="logo-bagong" src="logo/BAGONG-PILIPINAS-LOGO-1-1.png" alt="Bagong Pilipinas Logo" />
            </header>

            <div class="cert-title-block">
              <h2 class="cert-title-main" contenteditable="true">Certificate of Participation</h2>
              <div style="margin-top:1px;">${PPCLOrnaments.dividerWithBook(340)}</div>
              <p class="cert-subtitle-pill" contenteditable="true">This Certificate of Participation is hereby awarded to</p>
            </div>

            <div class="recipient-block">
              <div class="recipient-name" contenteditable="true">${participantName}</div>
            </div>

            <div class="citation-body" contenteditable="true">
              for having actively participated in and successfully completed the three-day training-workshop entitled
              <br />
              <span class="workshop-title">“Training-Workshop on Basic Preservation and Conservation of Paper-Based Collections”</span>
              <div class="citation-given">
                Held on <strong>November 4–6, 2026</strong> at the <strong>Puerto Princesa City Library</strong>,
                Puerto Princesa City, Palawan, Philippines.
              </div>
            </div>

            <footer class="signatories-wrapper">
              <div class="speakers-sig-row">
                <div class="sig-box">
                  <div class="sig-line"></div>
                  <div class="sig-name" contenteditable="true">ALEXANDER O. VETUS</div>
                  <div class="sig-role" contenteditable="true">Resource Speaker</div>
                </div>
                <div class="sig-box">
                  <div class="sig-line"></div>
                  <div class="sig-name" contenteditable="true">GENKIE R. ALBANO</div>
                  <div class="sig-role" contenteditable="true">Resource Speaker</div>
                </div>
                <div class="sig-box">
                  <div class="sig-line"></div>
                  <div class="sig-name" contenteditable="true">GERALDINE S. FRANCIA</div>
                  <div class="sig-role" contenteditable="true">Resource Speaker</div>
                </div>
              </div>

              <div class="bottom-librarian-row">
                <div class="cert-meta-left" contenteditable="true">
                  <strong>TRAINING-WORKSHOP 2026</strong><br />
                  Date: November 4–6, 2026<br />
                  Moderator: Don Angel Lou M. Salvatierra<br />
                  Cert. No.: PPCL-2026-PRT-${refNum}
                </div>

                <div class="librarian-sig-box">
                  <div class="sig-line"></div>
                  <div class="sig-name" contenteditable="true">JOYMARIE B. OLAPE, RL</div>
                  <div class="sig-role" contenteditable="true">City Librarian</div>
                  <div class="sig-office" contenteditable="true">Puerto Princesa City Library</div>
                </div>

                <div class="seal-right">
                  ${PPCLOrnaments.goldSealBadge(90)}
                </div>
              </div>
            </footer>
          </div>
        </div>
      `;
    }

    function renderBatchCertificates() {
      const raw = document.getElementById('participantListInput').value;
      const names = raw.split('\n').map(n => n.trim()).filter(Boolean);
      const container = document.getElementById('participant-certs-container');
      container.innerHTML = '';
      names.forEach((name, idx) => {
        const page = document.createElement('section');
        page.className = 'cert-page print-page';
        page.id = `participant-cert-${idx + 1}`;
        page.innerHTML = buildParticipantCertificate(name, idx);
        container.appendChild(page);
      });
    }

    renderBatchCertificates();
  </script>
</body>
</html>
